<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='700'>y</text></svg>">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent:      rgba(255, 255, 255, 0.88);
            --accent-dim:  rgba(255, 255, 255, 0.07);
            --accent-glow: rgba(255, 255, 255, 0.13);
            --card:        rgba(9, 9, 9, 0.92);
            --border:      rgba(255, 255, 255, 0.065);
            --border-hi:   rgba(255, 255, 255, 0.16);
            --text:        #e4e4ec;
            --muted:       #46465a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
            cursor: none;
        }

        /* ── custom cursor ── */
        .cur-dot {
            position: fixed;
            width: 6px; height: 6px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(255,255,255,0.9);
        }
        .cur-ring {
            position: fixed;
            width: 20px; height: 20px;
            border: 1.5px solid rgba(255,255,255,0.32);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width .15s ease, height .15s ease, border-color .15s ease, background-color .15s ease;
        }
        .cur-ring.hover {
            width: 32px; height: 32px;
            border-color: rgba(255,255,255,0.65);
            background: rgba(255,255,255,0.06);
        }

        /* ── background ── */
        .bg-layer {
            position: fixed; inset: 0;
            background-image: url('https://github.com/freecrime/yro/releases/download/1/bg.gif');
            background-size: cover;
            background-position: center;
            filter: blur(10px) saturate(0.7);
            opacity: 0.2;
            z-index: 0;
            transform: scale(1.06);
        }
        .vignette {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.75) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* ── overlay ── */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(20px) saturate(0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: none;
            gap: 10px;
            transition: opacity 0.85s cubic-bezier(.4,0,.2,1);
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }

        .overlay-clock {
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 9px;
            color: rgba(255,255,255,0.16);
            font-variant-numeric: tabular-nums;
        }
        .overlay-hint {
            font-size: 9.5px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.07);
            margin-top: 2px;
        }

        /* ── volume control ── */
        .vol-wrap {
            position: fixed;
            top: 18px; right: 16px;
            z-index: 15;
            display: flex;
            align-items: center;
            gap: 7px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease 0.6s;
        }
        body.entered .vol-wrap { opacity: 1; pointer-events: auto; }

        .vol-btn {
            width: 24px; height: 24px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            cursor: none;
            transition: background .25s, border-color .25s;
            backdrop-filter: blur(10px);
        }
        .vol-btn:hover { background: rgba(255,255,255,0.09); border-color: var(--border-hi); }
        .vol-btn svg { width: 13px; height: 13px; color: #555; transition: color .25s; display: block; }
        .vol-btn:hover svg { color: #bbb; }

        .vol-track {
            max-width: 0; overflow: hidden; opacity: 0;
            transition: max-width .5s cubic-bezier(.4,0,.2,1), opacity .35s ease;
        }
        .vol-wrap:hover .vol-track { max-width: 72px; opacity: 1; }

        .vol-track input {
            width: 64px; height: 3px; border-radius: 3px;
            background: rgba(255,255,255,0.1);
            outline: none; -webkit-appearance: none; cursor: none;
            display: block;
        }
        .vol-track input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 9px; height: 9px; border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        /* ── card ── */
        .page-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .container {
            max-width: 390px; width: 100%;
            position: relative; z-index: 1;
            background: var(--card);
            backdrop-filter: blur(32px) saturate(1.15);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 26px 26px 22px;
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.6),
                0 10px 50px rgba(0,0,0,0.7),
                0 0 80px var(--accent-glow);
        }

        /* ── uid ── */
        .uid {
            position: absolute;
            top: 13px; right: 13px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 3px 9px;
            font-size: 9.5px;
            color: var(--muted);
            cursor: none;
            transition: all .25s ease;
            height: 21px;
            display: flex; align-items: center;
            overflow: hidden;
        }
        .uid:hover { background: rgba(255,255,255,0.07); border-color: var(--border-hi); color: rgba(255,255,255,0.7); }

        .uid-text { position: relative; display: inline-block; min-width: 28px; text-align: center; }
        .uid-a, .uid-b {
            position: absolute; left: 0; top: 50%;
            transform: translateY(-50%);
            width: 100%;
            transition: opacity .3s ease;
        }
        .uid-a { opacity: 1; }
        .uid-b { opacity: 0; }
        .uid:hover .uid-a { opacity: 0; }
        .uid:hover .uid-b { opacity: 1; }

        /* ── profile header ── */
        .profile-header {
            display: flex; align-items: center;
            gap: 13px;
            margin-bottom: 20px;
            margin-top: 2px;
        }

        .avatar-wrap { position: relative; flex-shrink: 0; }

        .avatar {
            width: 64px; height: 64px;
            border-radius: 50%; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.09);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* status indicator: a solid "cutout" ring sitting on the avatar edge,
           with the actual status shape centered inside it — matches Discord's
           real construction instead of a plain bordered dot */
        .status-ring {
            position: absolute;
            bottom: -2px; right: -2px;
            width: 19px; height: 19px;
            background: #0a0a0d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            overflow: hidden;
        }
        .status-dot {
            position: relative;
            width: 13px; height: 13px;
            border-radius: 50%;
            background: #23a55a;
            box-sizing: border-box;
            transition: background-color .3s ease, border-color .3s ease;
        }
        /* online — solid dot, discord green */
        .status-dot.status-online { background: #23a55a; }

        /* idle — yellow dot with a bite taken out, like a crescent moon */
        .status-dot.status-idle { background: #f0b232; }
        .status-dot.status-idle::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px;
            width: 13px; height: 13px;
            border-radius: 50%;
            background: #0a0a0d;
        }

        /* dnd — red dot with a short horizontal bar cut out */
        .status-dot.status-dnd { background: #f23f43; }
        .status-dot.status-dnd::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6.5px; height: 2.4px;
            border-radius: 1px;
            background: #0a0a0d;
        }

        /* offline — hollow grey ring */
        .status-dot.status-offline {
            background: transparent;
            border: 2px solid #80848e;
        }

        .profile-info { flex: 1; min-width: 0; }

        /* ── name (dark → silver animated) ── */
        .name-wrap { position: relative; display: inline-block; }

        .name {
            font-size: 21px; font-weight: 600; letter-spacing: -0.5px;
            display: inline-block;
            background: linear-gradient(90deg, #f4f4f8 0%, #2a2a30 45%, #f4f4f8 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
        }
        .name::before {
            content: 'yro';
            position: absolute; left: 0; top: 0;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #6d6d75, #cfcfd8, #6d6d75);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            opacity: 0.35; z-index: -1;
        }
        @keyframes shimmer {
            0%, 100% { background-position: -200% 0; }
            50%       { background-position:  200% 0; }
        }

        .particles-canvas {
            position: absolute;
            top: -18px; left: -18px;
            width: calc(100% + 36px);
            height: calc(100% + 36px);
            pointer-events: none; z-index: 2;
        }

        /* ── badges ── */
        .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

        .badge {
            position: relative;
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all .22s ease;
            cursor: none;
        }
        .badge-icon { width: 10px; height: 10px; color: #444; transition: all .22s ease; }

        .badge::after {
            content: attr(data-label);
            position: absolute;
            bottom: -27px; left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: rgba(4,4,8,.97);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 5px;
            padding: 3px 8px;
            font-size: 9.5px; color: rgba(255,255,255,.75);
            white-space: nowrap; opacity: 0; pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            z-index: 30;
        }
        .badge:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* badge colours */
        .badge.carry:hover   { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.35); box-shadow: 0 0 10px rgba(255,255,255,.18); }
        .badge.carry:hover .badge-icon { color: #f2f2f5; filter: drop-shadow(0 0 4px rgba(255,255,255,.75)); }

        .badge.verified:hover { background: rgba(34,197,94,.08); border-color: rgba(34,197,94,.32); box-shadow: 0 0 9px rgba(34,197,94,.16); }
        .badge.verified:hover .badge-icon { color: #4ade80; filter: drop-shadow(0 0 4px rgba(34,197,94,.7)); }

        .badge.staff:hover   { background: rgba(251,191,36,.08); border-color: rgba(251,191,36,.3); box-shadow: 0 0 9px rgba(251,191,36,.15); }
        .badge.staff:hover .badge-icon { color: #fbbf24; filter: drop-shadow(0 0 4px rgba(251,191,36,.6)); }

        .badge.inviter:hover { background: rgba(244,114,182,.08); border-color: rgba(244,114,182,.3); animation: inviter-glow 2s ease-in-out infinite; }
        .badge.inviter:hover .badge-icon { color: #f472b6; filter: drop-shadow(0 0 4px rgba(244,114,182,.7)); }
        @keyframes inviter-glow {
            0%, 100% { box-shadow: 0 0 7px rgba(244,114,182,.18); }
            50%       { box-shadow: 0 0 16px rgba(244,114,182,.38); }
        }

        /* ── bio ── */
        .bio {
            font-size: 11.5px;
            color: #3e3e50;
            line-height: 1.75;
            margin-bottom: 12px;
        }

        /* ── stat cards ── */
        .stats {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .stat-card {
            flex: 1;
            text-align: center;
            background: rgba(255,255,255,0.025);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 7px 4px 6px;
            transition: all .22s ease;
            cursor: none;
        }
        .stat-card:hover {
            background: var(--accent-dim);
            border-color: rgba(255,255,255,.22);
        }
        .stat-value {
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: #e8e8f0;
        }
        .stat-label {
            font-size: 7.5px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #3a3a4c;
            margin-top: 3px;
        }

        /* ── divider ── */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.055), transparent);
            margin: 14px 0;
        }

        /* ── section label ── */
        .label {
            font-size: 8.5px;
            letter-spacing: 2.8px;
            text-transform: uppercase;
            color: #2c2c3e;
            margin-bottom: 9px;
        }

        /* ── achievements ── */
        .achievements { display: flex; gap: 8px; flex-wrap: wrap; }

        .ach {
            position: relative;
            display: flex; align-items: center; gap: 5px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.055);
            border-radius: 7px;
            padding: 3px 8px 3px 4px;
            transition: all .22s ease;
            cursor: none;
        }
        .ach:hover {
            background: var(--accent-dim);
            border-color: rgba(255,255,255,.3);
        }
        .ach img {
            width: 16px; height: 16px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.15));
        }
        .ach-name {
            font-size: 10px;
            color: #4a4a62;
            letter-spacing: 0.2px;
            transition: color .22s ease;
        }
        .ach:hover .ach-name { color: rgba(255,255,255,.88); }
        .ach::after {
            content: attr(data-tip);
            position: absolute;
            bottom: -30px; left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(4,4,8,.97);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 5px;
            padding: 4px 9px;
            font-size: 9px; line-height: 1.3; color: rgba(255,255,255,.8);
            white-space: nowrap; opacity: 0; pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            z-index: 30;
        }
        .ach:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── services ── */
        .services { display: flex; flex-wrap: wrap; gap: 6px; }

        .svc {
            position: relative;
            font-size: 10.5px;
            color: #3a3a52;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.055);
            border-radius: 7px;
            padding: 4px 10px;
            letter-spacing: 0.2px;
            transition: all .22s ease;
            cursor: none;
        }
        .svc:hover {
            background: var(--accent-dim);
            border-color: rgba(255,255,255,.3);
            color: rgba(255,255,255,.88);
        }
        .svc::after {
            content: attr(data-tip);
            position: absolute;
            bottom: -32px; left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(4,4,8,.97);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 5px;
            padding: 5px 9px;
            font-size: 9px; line-height: 1.3; color: rgba(255,255,255,.8);
            white-space: nowrap; opacity: 0; pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            z-index: 30;
        }
        .svc:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── links ── */
        .links { display: flex; justify-content: center; gap: 18px; }

        .link {
            position: relative;
            display: flex; align-items: center; justify-content: center;
            width: 22px; height: 22px;
            opacity: 0.5;
            transition: opacity .2s ease, transform .2s ease;
            cursor: none; text-decoration: none;
        }
        .link:hover { opacity: 1; transform: translateY(-2px); }
        .link svg { fill: #fff; width: 100%; height: 100%; }

        .tip {
            position: absolute;
            bottom: -27px; left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(4,4,8,.97);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 5px;
            padding: 3px 8px;
            font-size: 9.5px; color: rgba(255,255,255,.7);
            white-space: nowrap; opacity: 0; pointer-events: none;
            transition: opacity .18s ease, transform .18s ease;
            z-index: 30;
        }
        .link:hover .tip { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── footer row ── */
        .footer-row {
            display: flex; align-items: center;
            justify-content: center;
            margin-top: 14px;
        }

        .location {
            display: flex; align-items: center; gap: 4px;
            font-size: 9.5px; color: #2a2a3a;
            flex-shrink: 0;
        }
        .location svg { width: 9px; height: 9px; fill: #2a2a3a; flex-shrink: 0; }

        /* ── now playing pill (lives outside the card) ── */
        .now-playing-pill {
            margin: 12px auto 0;
            width: fit-content;
            max-width: 240px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            background: rgba(9, 9, 9, 0.72);
            backdrop-filter: blur(24px) saturate(1.15);
            border: 1px solid var(--border);
            border-radius: 999px;
            box-shadow: 0 8px 26px rgba(0,0,0,0.55);
            position: relative;
            z-index: 1;
        }

        /* now playing marquee */
        .now-playing {
            flex: 1;
            min-width: 0;
            max-width: 150px;
            overflow: hidden;
            position: relative;
            height: 11px;
            display: flex;
            align-items: center;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
        }
        .np-track {
            display: flex;
            width: max-content;
            will-change: transform;
        }
        .np-track span {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            font-size: 9.5px;
            color: #4a4a62;
            padding-right: 34px;
        }
        .np-track span::before {
            content: '♪';
            margin-right: 5px;
            font-size: 8.5px;
            color: #40405a;
        }

        /* music bars */
        .music-bars {
            display: flex; align-items: flex-end; gap: 2px; height: 10px;
            flex-shrink: 0;
        }
        .bar {
            width: 2px;
            background: var(--accent);
            border-radius: 1px;
            opacity: 0.4;
            animation: bar-bounce 1.4s ease-in-out infinite;
        }
        .bar:nth-child(1) { height: 4px;  animation-delay: 0s; }
        .bar:nth-child(2) { height: 9px;  animation-delay: .2s; }
        .bar:nth-child(3) { height: 6px;  animation-delay: .35s; }
        .bar:nth-child(4) { height: 10px; animation-delay: .1s; }
        .bar:nth-child(5) { height: 5px;  animation-delay: .28s; }
        @keyframes bar-bounce {
            0%, 100% { transform: scaleY(0.35); }
            50%       { transform: scaleY(1); }
        }
    </style>
</head>
<body>

    <!-- cursor -->
    <div class="cur-dot" id="curDot"></div>
    <div class="cur-ring" id="curRing"></div>

    <!-- bg layers -->
    <div class="bg-layer"></div>
    <div class="vignette"></div>

    <!-- entrance overlay -->
    <div class="overlay" id="overlay">
        <div class="overlay-clock" id="overlayClock">00:00</div>
        <div class="overlay-hint">click to enter</div>
    </div>

    <!-- volume -->
    <div class="vol-wrap">
        <div class="vol-track">
            <input type="range" min="0" max="100" value="10" id="volSlider">
        </div>
        <div class="vol-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9v6h3.6l4.4 4V5l-4.4 4H4z" fill="currentColor" stroke="none"/>
                <path d="M15.3 8.7a5 5 0 0 1 0 6.6"/>
                <path d="M18 6.2a8.5 8.5 0 0 1 0 11.6"/>
            </svg>
        </div>
    </div>

    <!-- card -->
    <div class="page-stack">
    <div class="container">

        <!-- uid -->
        <div class="uid">
            <span class="uid-text">
                <span class="uid-a">#999</span>
                <span class="uid-b">UID</span>
            </span>
        </div>

        <!-- header -->
        <div class="profile-header">
            <div class="avatar-wrap">
                <div class="avatar">
                    <img src="https://github.com/freecrime/yro/releases/download/1/pfp.png" alt="yro">
                </div>
                <div class="status-ring">
                    <div class="status-dot status-online" id="statusDot"></div>
                </div>
            </div>
            <div class="profile-info">
                <div class="name-wrap">
                    <h1 class="name">yro</h1>
                    <canvas class="particles-canvas" id="particlesCanvas"></canvas>
                </div>
                <div class="badges">
                    <div class="badge carry" data-label="Carry Service">

    <script>
    (() => {
        /* ── custom cursor ── */
        const dot  = document.getElementById('curDot');
        const ring = document.getElementById('curRing');
        let mx = 0, my = 0, rx = 0, ry = 0;

        document.addEventListener('mousemove', e => {
            mx = e.clientX; my = e.clientY;
            dot.style.left = mx + 'px';
            dot.style.top  = my + 'px';
        });

        (function lerp() {
            rx += (mx - rx) * 0.35;
            ry += (my - ry) * 0.35;
            ring.style.left = rx + 'px';
            ring.style.top  = ry + 'px';
            requestAnimationFrame(lerp);
        })();

        /* cursor hover feedback on interactive elements */
        const hoverSelector = 'a, .badge, .svc, .ach, .vol-btn, .uid, .stat-card, input[type=range]';
        document.addEventListener('mouseover', e => {
            if (e.target.closest(hoverSelector)) ring.classList.add('hover');
        });
        document.addEventListener('mouseout', e => {
            if (e.target.closest(hoverSelector) && !e.relatedTarget?.closest(hoverSelector)) {
                ring.classList.remove('hover');
            }
        });

        /* ── discord presence (lanyard) ── */
        const DISCORD_ID = '946048505854689340';
        const statusDot  = document.getElementById('statusDot');

        const STATUS_MAP = {
            online:  { label: 'Online' },
            idle:    { label: 'Idle' },
            dnd:     { label: 'Do Not Disturb' },
            offline: { label: 'Offline' }
        };

        function applyStatus(status) {
            const key = STATUS_MAP[status] ? status : 'offline';
            statusDot.classList.remove('status-online', 'status-idle', 'status-dnd', 'status-offline');
            statusDot.classList.add('status-' + key);
            statusDot.title = STATUS_MAP[key].label;
        }

        async function fetchDiscordStatus() {
            try {
                const res  = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const json = await res.json();
                if (json.success) applyStatus(json.data.discord_status);
            } catch (e) {
                /* leave last known status on failure */
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 15000);

        /* ── live clock ── */
        const clockEl = document.getElementById('overlayClock');
        function tick() {
            const n = new Date();
            const h = String(n.getHours()).padStart(2,'0');
            const m = String(n.getMinutes()).padStart(2,'0');
            clockEl.textContent = h + ':' + m;
        }
        tick();
        setInterval(tick, 1000);

        /* ── overlay / audio ── */
        const overlay = document.getElementById('overlay');
        const audio   = document.getElementById('bgMusic');
        audio.volume  = 0.1;
        let entered   = false;

        overlay.addEventListener('click', () => {
            if (entered) return;
            entered = true;
            audio.play().catch(() => {});
            overlay.classList.add('hidden');
            document.body.classList.add('entered');
        });

        /* ── volume ── */
        document.getElementById('volSlider').addEventListener('input', function() {
            audio.volume = this.value / 100;
        });

        /* ── title scroll ── */
        const base = 'yro' + '     ';
        let ti = 0;
        setInterval(() => {
            document.title = base.slice(ti) + base.slice(0, ti);
            ti = (ti + 1) % base.length;
        }, 380);

        /* ── particles ── */
        const canvas = document.getElementById('particlesCanvas');
        const ctx    = canvas.getContext('2d');
        let   pts    = [];

        function resize() {
            const p = canvas.parentElement;
            canvas.width  = p.offsetWidth  + 36;
            canvas.height = p.offsetHeight + 36;
        }

        class Pt {
            constructor() { this.reset(); }
            reset() {
                this.x  = canvas.width  / 2 + (Math.random() - .5) * 36;
                this.y  = canvas.height / 2 + (Math.random() - .5) * 14;
                this.sz = Math.random() * 0.85 + 0.25;
                this.vx = (Math.random() - .5) * 0.22;
                this.vy = (Math.random() - .5) * 0.22;
                this.op = Math.random() * 0.45 + 0.25;
                const c = ['#ffffff','#e4e4ec','#c9c9d4','#f2f2f5','#d6d6e0'];
                this.col = c[Math.floor(Math.random() * c.length)];
            }
            update() {
                this.x  += this.vx;
                this.y  += this.vy;
                this.op -= 0.0045;
                if (this.op <= 0 || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height)
                    this.reset();
            }
            draw() {
                ctx.shadowBlur  = 5;
                ctx.shadowColor = this.col;
                ctx.globalAlpha = this.op;
                ctx.fillStyle   = this.col;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.sz, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initPts() { pts = []; for (let i = 0; i < 18; i++) pts.push(new Pt()); }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 0;
            pts.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => { resize(); initPts(); fixMarquee(); });
        window.addEventListener('load',   () => { resize(); initPts(); draw(); fixMarquee(); });

        /* ── seamless marquee ──
           Driven by rAF instead of a CSS @keyframes loop, so there is no
           reset frame: position is (elapsed * speed) % spanWidth, which is
           mathematically continuous, so the "second copy" always slides
           in from the right at the exact same spot the first copy left
           the left edge — no pop, no jump.                                */
        let marqueeRAF = null;
        function fixMarquee() {
            const wrap   = document.querySelector('.now-playing');
            const track  = document.querySelector('.np-track');
            const span1  = track && track.querySelector('span:first-child');
            if (!wrap || !track || !span1) return;

            if (marqueeRAF) { cancelAnimationFrame(marqueeRAF); marqueeRAF = null; }
            track.style.transform = 'translateX(0)';

            const spanW = span1.offsetWidth;
            const wrapW = wrap.offsetWidth;

            /* text fits without scrolling — leave it static */
            if (spanW <= wrapW) return;

            const speed = 22; /* px per second */
            let start = null;
            function step(ts) {
                if (start === null) start = ts;
                const elapsed = (ts - start) / 1000;
                const x = (elapsed * speed) % spanW;
                track.style.transform = `translateX(-${x}px)`;
                marqueeRAF = requestAnimationFrame(step);
            }
            marqueeRAF = requestAnimationFrame(step);
        }
    })();
    </script>
